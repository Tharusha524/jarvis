[package]
name = "jarvis"
version = "0.1.0"
description = "JARVIS personal AI desktop assistant"
edition = "2021"

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"

[profile.release]
# Smaller installer at the cost of a slower final build.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
